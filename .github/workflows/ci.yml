name: CI

# Checks on every push to main and on every pull request. CI never deploys and
# holds no deploy token: the server is deployed by Cofferdam's maintainers.
on:
  push:
    branches: [main]
  pull_request:

# Read-only for every job that does not ask for more. The job that runs the
# dependencies' code never holds a token that can write.
permissions:
  contents: read

jobs:
  mcp:
    name: mcp
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mcp
    outputs:
      install: ${{ steps.install.outcome }}
      test: ${{ steps.test.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: mcp/yarn.lock
      - id: install
        run: yarn install --frozen-lockfile
      - id: test
        run: yarn test

  # On a pull request, one comment with the result of every step of the job
  # above and the run URL, updated in place on every run, so a reviewer or a
  # tool that reads the pull request's comments sees the result for the head
  # commit without opening the run. It is a job of its own because it holds
  # the one token here that can write (pull-requests: write, nothing else): it
  # checks out nothing and runs no code from the repository or its
  # dependencies. Skipped for a pull request from a fork, whose token cannot
  # write.
  report:
    name: report
    needs: mcp
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Report the result on the pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          JOB: mcp
          JOB_RESULT: ${{ needs.mcp.result }}
          OUTCOMES: ${{ toJSON(needs.mcp.outputs) }}
          STEP_LABELS: |
            install=yarn install --frozen-lockfile
            test=yarn test
        with:
          script: |
            const job = process.env.JOB;
            const marker = `<!-- cofferdam-ci:${job} -->`;
            const outcomes = JSON.parse(process.env.OUTCOMES || '{}') ?? {};
            const words = { success: '✅ pass', failure: '❌ fail', cancelled: '🚫 cancelled', skipped: '⏭️ skipped' };
            const rows = process.env.STEP_LABELS.trim().split('\n').map((line) => {
              const [id, ...label] = line.split('=');
              return { label: label.join('='), outcome: outcomes[id] || 'skipped' };
            });
            // Passed only when the whole job succeeded and every listed step ran
            // and passed: a failed setup step skips them all, and skipped rows
            // must never read as green.
            const failed = process.env.JOB_RESULT !== 'success' || rows.some((row) => row.outcome !== 'success');
            const sha = context.payload.pull_request.head.sha;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `### CI ${failed ? '❌ failed' : '✅ passed'} · \`${job}\` on ${sha.slice(0, 7)}`,
              '',
              '| Step | Result |',
              '| --- | --- |',
              ...rows.map((row) => `| \`${row.label}\` | ${words[row.outcome] ?? row.outcome} |`),
              '',
              `[Run ${context.runId}, attempt ${process.env.GITHUB_RUN_ATTEMPT}](${runUrl})`,
            ].join('\n');
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number, per_page: 100 });
            const existing = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
